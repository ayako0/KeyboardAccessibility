<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directional Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigable Grid Elements -->
    <main class="grid-container">
        <button class="nav-item" data-row="0" data-col="0">Item 1</button>
        <button class="nav-item" data-row="0" data-col="1">Item 2</button>
        <button class="nav-item" data-row="0" data-col="2">Item 3</button>
        
        <button class="nav-item" data-row="1" data-col="0">Item 4</button>
        <button class="nav-item" data-row="1" data-col="1">Item 5</button>
        <button class="nav-item" data-row="1" data-col="2">Item 6</button>
        
        <button class="nav-item" data-row="2" data-col="0">Item 7</button>
        <button class="nav-item" data-row="2" data-col="1">Item 8</button>
        <button class="nav-item" data-row="2" data-col="2">Item 9</button>
    </main>

    <!-- Mobile On-Screen D-Pad -->
    <div class="dpad-container">
        <button class="dpad-btn" id="dpad-up">▲</button>
        <div class="dpad-row">
            <button class="dpad-btn" id="dpad-left">◀</button>
            <div class="dpad-center"></div>
            <button class="dpad-btn" id="dpad-right">▶</button>
        </div>
        <button class="dpad-btn" id="dpad-down">▼</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
